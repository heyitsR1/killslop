name: Bug report
description: Something in the extension or the API does not work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: The YouTube page where it happened, if any.
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown on chrome://extensions.
  - type: input
    id: browser
    attributes:
      label: Browser and version
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, console errors, settings you changed.
